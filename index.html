<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Odin Admin Dashboard</title>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="site-1">Side 1</div>
            <div class="site-2">Side 2</div>
            <div class="site-3">Side 3</div>
            <div class="site-3">Side 4</div>
        </div>
        <div class="sidebar">
            <div class="logo">
                <img src="icons/sidebar/layout-dashboard.svg" alt="Logo">
                <a href="" class="title">Dashboard</a>
            </div>
            <div class="menu">
                <div>
                    <img src="icons/sidebar/house.svg" alt="">
                    <a href="">Home</a>
                </div>
                <div>
                    <img src="icons/sidebar/square-user.svg" alt="">
                    <a href="">Profile</a>
                </div>
                <div>
                    <img src="icons/sidebar/message-square.svg" alt="">
                    <a href="">Messages</a>
                </div>
                <div>
                    <img src="icons/sidebar/rotate-ccw-clock.svg" alt="">
                    <a href="">History</a>
                </div>
                <div>
                    <img src="icons/sidebar/sticky-note.svg" alt="">
                    <a href="">Tasks</a>
                </div>
                <div>
                    <img src="icons/sidebar/user-group.svg" alt="">
                    <a href="">Communities</a>
                </div>
            </div>
            <div class="admin">
                <div>
                    <img src="icons/sidebar/settings.svg" alt="">
                    <a href="">Settings</a>
                </div>
                <div>
                    <img src="icons/sidebar/info.svg" alt="">
                    <a href="">Support</a>
                </div>
                <div>
                    <img src="icons/sidebar/shield-lock.svg" alt="">
                    <a href="">Privacy</a>
                </div>
            </div>
        </div>
        <div class="main-content">
            <div class="projects">
                <p class="title-1">Your Projects</p>
                <div class="box-1">Box 1</div>
                <div class="box-2">Box 2</div>
                <div class="box-3">Box 3</div>
                <div class="box-4">Box 4</div>
                <div class="box-5">Box 5</div>
                <div class="box-6">Box 6</div>
            </div>
            <div class="announcements">
                <p class="title-2">Announcements</p>
                <div class="content-1"></div>
            </div>
            <div class="trending">
                <p class="title-3">Trending</p>
                <div class="content-2"></div>
            </div>
        </div>
    </div>
</body>

</html>
